# /etc/needrestart/conf.d/bitpin-bot.conf - installed by deploy/install.sh / update.sh (release v3).
# Ubuntu's needrestart restarts services whose libraries were upgraded by apt (unattended-upgrades runs
# daily). A restart in the middle of a cycle is a restart between an order and its journal write, so the
# two TRADING units (bitpin-bot, bitpin-bot-paper) are excluded here: they restart only when the owner says
# so (update.sh, systemctl). The notifier and the oneshot units are restarted like any service. After a
# security update of Python or OpenSSL the bot keeps the old library until the owner restarts it: the
# monthly checklist (docs/DEPLOY_FA.md, item 12) says how and when. Perl syntax (needrestart's config
# format); removed by uninstall.sh.
$nrconf{override_rc}{qr(^bitpin-bot(-paper)?\.service$)} = 0;
